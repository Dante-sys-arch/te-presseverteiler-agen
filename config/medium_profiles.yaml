    impressum:
      - /impressum
    redaktion:
      - /redaktion
    team:
      - /team
    kontakt:
      - /kontakt
    autorenseiten:
      - /autor
    ressortseiten:
      - /politik
      - /wirtschaft
    interne_suche:
      - /suche?q={query}
  preferred_contact_pages:
    - /kontakt
    - /impressum
  team_patterns:
    - https://{domain}/team
    - https://{domain}/redaktion
  author_patterns:
    - https://{domain}/autor/{slug}
