  search_patterns:
    - https://{domain}/suche?q={query}
    - https://{domain}/search?q={query}
  source_priority:
    impressum: niedrig
    redaktion: hoch
    team: hoch
    kontakt: mittel
    autorenseiten: hoch
    ressortseiten: mittel
    interne_suche: mittel

